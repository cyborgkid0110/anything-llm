appId: io.github.cyborgkid0110.anythingllm
# Distinct from the official "AnythingLLM": separate /opt dir and Windows install dir.
productName: AnythingLLM Custom
copyright: MIT License, Mintplex Labs Inc. and contributors
directories:
  output: dist
  buildResources: assets
files:
  - src/**
  - assets/**
  - package.json
  - "!**/__tests__/**"
asar: true
# Server and collector stay unpacked: they spawn children from plain node_modules.
# Copied as one folder because a source dir's own top-level node_modules is
# always filtered out by electron-builder.
extraResources:
  - from: build/resources
    to: .
linux:
  target:
    - target: deb
      arch: [x64]
  executableName: anythingllm-custom
  category: Utility
  icon: assets/icon.png
  synopsis: Private AI workspace with local models
  desktop:
    entry:
      Name: AnythingLLM
  syncDesktopName: true
deb:
  packageName: anythingllm-custom
  vendor: cyborgkid0110
  packageCategory: utils
  artifactName: anythingllm-custom_${version}_${arch}.${ext}
  # Replaces the defaults, so they are repeated here plus libssl3 for Prisma.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libssl3
win:
  target:
    - target: nsis
      arch: [x64]
  executableName: anythingllm-custom
  icon: assets/icon.png
nsis:
  artifactName: AnythingLLM-Custom-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: AnythingLLM
