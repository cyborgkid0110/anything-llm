name: Desktop build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# master-dev is the custom app's main line; feature branches merge into it through pull requests once this passes.
# A v* tag on master-dev builds, smoke-tests and publishes a GitHub release (path filters don't apply to tags).
on:
  workflow_dispatch:
  push:
    branches: ["master-dev", "feat/**"]
    tags: ["v*"]
    paths:
      - "desktop/**"
      - "server/**"
      - "collector/**"
      - "frontend/**"
      - ".github/workflows/desktop-build.yaml"
  pull_request:
    branches: ["master-dev"]
    paths:
      - "desktop/**"
      - "server/**"
      - "collector/**"
      - "frontend/**"
      - ".github/workflows/desktop-build.yaml"

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 keeps the glibc baseline of the .deb low.
        os: [ubuntu-22.04, windows-2022]
    env:
      SHARP_IGNORE_GLOBAL_LIBVIPS: "true"
      PUPPETEER_SKIP_DOWNLOAD: "true"
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          # No yarn cache here: it would restore several GB onto a 14 GB runner.

      - name: Install xvfb
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # The root has no lockfile (jest only), so it cannot be frozen.
      - name: Install root dependencies
        run: yarn install

      # @vscode/ripgrep downloads its binary from GitHub; the token avoids rate limits.
      - name: Install server dependencies
        run: cd server && yarn install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install collector dependencies
        run: cd collector && yarn install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate the Prisma client
        run: cd server && npx prisma generate

      - name: Install desktop dependencies
        run: cd desktop && yarn install --frozen-lockfile

      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          yarn setup:envs
          npx jest server collector desktop

      # Deliberately minimal: the desktop suite plus the server suites for the
      # Windows engine and runtime branches. Other server tests may assume POSIX.
      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: >
          npx jest desktop
          server/__tests__/utils/AiProviders/embeddedLemonade
          server/__tests__/utils/helpers/runtime.test.js

      # The build needs ~14 GB with everything installed, which is the whole
      # runner disk. prepare-resources reinstalls production dependencies into
      # desktop/build, so the dev installs and yarn's cache can go first.
      - name: Free disk space
        run: |
          rm -rf node_modules server/node_modules collector/node_modules
          yarn cache clean
          df -h .

      - name: Build installer
        run: |
          set +e
          (cd desktop && yarn dist) 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          [ "$status" -eq 0 ] || bash desktop/scripts/ci-annotate.sh "yarn dist failed" build.log
          exit "$status"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Disk usage
        if: always()
        run: |
          df -h .
          echo "::notice title=Disk usage::$(df -h . | awk '{printf "%s%%0A", $0}')"

      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        env:
          ANYTHINGLLM_DESKTOP_SMOKE: "1"
          ANYTHINGLLM_DESKTOP_USER_DATA: ${{ runner.temp }}/smoke-data
        run: |
          # The unpacked build has no setuid chrome-sandbox helper.
          timeout 240 xvfb-run -a desktop/dist/linux-unpacked/anythingllm-custom --no-sandbox 2>&1 | tee "$RUNNER_TEMP/smoke.out"
          grep -q "^SMOKE OK" "$RUNNER_TEMP/smoke.out" || {
            bash desktop/scripts/ci-annotate.sh "Smoke test failed" "$RUNNER_TEMP/smoke.out"
            exit 1
          }

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ANYTHINGLLM_DESKTOP_SMOKE: "1"
          ANYTHINGLLM_DESKTOP_USER_DATA: ${{ runner.temp }}\smoke-data
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoke.out"
          $err = Join-Path $env:RUNNER_TEMP "smoke.err"
          $result = Join-Path $env:ANYTHINGLLM_DESKTOP_USER_DATA "smoke-result.txt"
          $p = Start-Process -FilePath "desktop\dist\win-unpacked\anythingllm-custom.exe" `
            -RedirectStandardOutput $out -RedirectStandardError $err `
            -PassThru -Wait
          # A GUI exe may have no readable stdout, so the app also writes the
          # result to a file in its user-data folder.
          foreach ($f in $out, $err, $result) { if (Test-Path $f) { Get-Content $f } }
          $ok = (Test-Path $result) -and (Select-String -Path $result -Pattern "^SMOKE OK" -Quiet)
          if ($p.ExitCode -ne 0 -or -not $ok) {
            $logs = Join-Path $env:ANYTHINGLLM_DESKTOP_USER_DATA "logs"
            $summary = Join-Path $env:RUNNER_TEMP "smoke-summary.txt"
            & {
              foreach ($f in $result, $out, $err, (Join-Path $logs "server.log"), (Join-Path $logs "collector.log")) {
                if (Test-Path $f) { "== $f"; Get-Content $f -Tail 40 }
              }
            } | Set-Content $summary
            bash desktop/scripts/ci-annotate.sh "Smoke test failed (exit code $($p.ExitCode))" ($summary -replace '\\', '/') 80
            throw "Smoke test failed (exit code $($p.ExitCode))"
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: anythingllm-custom-${{ runner.os }}
          path: |
            desktop/dist/*.deb
            desktop/dist/*.exe
          if-no-files-found: error

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ runner.os }}
          path: |
            ${{ runner.temp }}/smoke.out
            ${{ runner.temp }}/smoke.err
            ${{ runner.temp }}/smoke-data/logs
            ${{ runner.temp }}/smoke-data/smoke-result.txt
          if-no-files-found: ignore

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the tag to be on master-dev
        run: |
          git fetch origin master-dev
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master-dev || {
            echo "::error title=Release refused::${GITHUB_REF_NAME} is not on master-dev"
            exit 1
          }

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: anythingllm-custom-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          notes=".github/release-notes/${tag}.md"
          [ -f "$notes" ] || { echo "::error title=Release refused::missing $notes"; exit 1; }
          # A version with a suffix (eg 1.20.0-beta1) is a prerelease.
          prerelease=""
          case "$tag" in *-*) prerelease="--prerelease" ;; esac
          (cd release && sha256sum * > SHA256SUMS.txt && ls -la)
          gh release create "$tag" release/* --verify-tag $prerelease \
            --title "AnythingLLM Custom ${tag#v}" --notes-file "$notes"
